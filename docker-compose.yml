services:
  netrekfp:
    build: .
    container_name: netrekfp
    ports:
      - "9701:9701"
    restart: unless-stopped
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9701/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
